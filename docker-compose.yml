services:
  # 1. Backend Laravel (PHP 8.2 & Apache/Nginx)
  laravel_backend:
    image: bitnamilegacy/laravel:10
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    environment:
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_DATABASE=greenvision
      - DB_USERNAME=greenuser
      - DB_PASSWORD=rootpass
    depends_on:
      - mysql_db

  # 2. Database MySQL
  mysql_db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=greenvision
      - MYSQL_USER=greenuser
      
      - MYSQL_PASSWORD=rootpass
      - MYSQL_ROOT_PASSWORD=rootpass
    volumes:
      - mysql_data:/var/lib/mysql

  # 3. AI Python Model & API (Flask)
  python_ai:
    build:
      context: ./python
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./python:/app

  # 4. phpMyAdmin Database Management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql_db
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=rootpass
    depends_on:
      - mysql_db

volumes:
  mysql_data:
    driver: local
