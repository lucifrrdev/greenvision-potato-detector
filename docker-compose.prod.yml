services:
  # 1. Backend Laravel (PHP 8.2) - Production
  laravel_backend:
    image: bitnamilegacy/laravel:10
    restart: always
    volumes:
      - ./app:/app
    env_file:
      - ./app/.env.production
    depends_on:
      - mysql_db
    networks:
      - greenvision-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laravel.rule=Host(`greenvision.catrova.com`)"
      - "traefik.http.routers.laravel.entrypoints=web"
      - "traefik.http.services.laravel.loadbalancer.server.port=8000"

  # 2. Database MySQL - Production
  mysql_db:
    image: mysql:8.0
    restart: always
    ports:
      - "8003:3306"
    environment:
      - MYSQL_DATABASE=greenvision
      - MYSQL_USER=greenuser
      - MYSQL_PASSWORD=rootpass
      - MYSQL_ROOT_PASSWORD=rootpass
    volumes:
      - mysql_data_prod:/var/lib/mysql
    networks:
      - greenvision-net

  # 3. AI Python Model & API (Flask) - Production
  python_ai:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./python/.env.production
    networks:
      - greenvision-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.python_ai.rule=Host(`greenvision-ai.catrova.com`)"
      - "traefik.http.routers.python_ai.entrypoints=web"
      - "traefik.http.services.python_ai.loadbalancer.server.port=8001"

  # 4. phpMyAdmin (Optional/Disabled in Production by default for security)
  # Uncomment if database management is required in production environment
  phpmyadmin:
    image: phpmyadmin:latest
    platform: linux/arm64
    restart: always
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
      PMA_USER: greenuser
      PMA_PASSWORD: rootpass
    depends_on:
      - mysql_db
    networks:
      - greenvision-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin.rule=Host(`pma.greenvision.catrova.com`)"
      - "traefik.http.routers.phpmyadmin.entrypoints=web"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"

volumes:
  mysql_data_prod:
    driver: local

networks:
  greenvision-net:
    driver: bridge
